<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8cc99"><link rel="icon" href="data:,"><title>魔王面包房</title><link rel="stylesheet" href="active-ui.css"><script src="../shared/rewarded-ads.js"></script><script type="module" src="../shared/legibility.js"></script></head>
<body><main id="workshop" class="active-bakery">
 <header class="hud"><div><strong id="coins">0 金币</strong><button id="campaign" aria-label="查看经营旅程与下一步目标"><span id="journey-title">王国总厨之路</span><small id="work-next">采集第一批原料</small></button></div><div class="hud-buttons"><button id="inventory" aria-label="查看共用库存">库存</button><button id="orders-button">订单</button><button id="pause" aria-label="暂停">Ⅱ</button><button id="menu" aria-label="菜单">☰</button></div></header>
 <section class="room-heading"><div><h1 id="room-title">原料区</h1><p id="room-purpose">采集原料 → 搬到原料仓</p></div><button id="equipment">设备</button></section>
 <section id="scene" class="active-scene" aria-label="工作场景"><canvas id="board" tabindex="0" aria-label="点击地面移动，点击工位走近"></canvas><div id="stations"></div><div id="pause-shade" hidden>已暂停</div></section>
 <aside id="guide" aria-label="同步新手教程"><div><strong id="guide-title"></strong><button id="guide-hide" aria-label="收起教程">×</button></div><p id="guide-text" aria-live="polite"></p><button id="guide-go">定位目标</button></aside>
 <section class="action-bar"><p id="context" aria-live="polite">点麦田走近，再按住采集</p><button id="action" disabled>先选择工位</button></section>
 <nav id="rooms" class="rooms" aria-label="切换工作区域"><button data-room="raw" aria-current="page"><b>原料区</b><small>采集 · 入仓</small></button><button data-room="bake"><b>烘焙区</b><small>投料 · 取货</small></button><button data-room="shop"><b>门店区</b><small>交单 · 送餐</small></button><button data-room="delivery"><b>外卖区</b><small>打包 · 签收</small></button></nav>
</main><section id="landscape-prompt" hidden aria-labelledby="landscape-title"><div><span class="rotate-phone" aria-hidden="true">▭ ↻</span><h1 id="landscape-title">请横过手机经营面包房</h1><p>四区按横屏布局，横屏后继续。<br>当前进度已保留，采集和加工暂时停止。</p><button id="landscape-fullscreen">全屏横屏</button><button id="landscape-exit">返回合集</button></div></section><div id="toast" role="status" aria-live="polite"></div><dialog id="panel" aria-labelledby="panel-title"><header><h2 id="panel-title"></h2><button id="close-panel" aria-label="关闭">×</button></header><div id="panel-body"></div></dialog><script type="module" src="game.js"></script><script type="module" src="../shared/camp-wallet.js"></script></body></html>
