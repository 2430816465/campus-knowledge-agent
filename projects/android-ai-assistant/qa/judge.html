<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>心动军师 · 匿名盲评</title>
<style>body{font:16px/1.6 system-ui,sans-serif;margin:0;background:#f4f6f3;color:#183630}main{max-width:1080px;margin:auto;padding:24px}h1{font-size:28px}section,article{background:white;padding:20px;border-radius:14px;margin:14px 0}label{display:block;margin:10px 0}input,select,button,textarea{font:inherit;padding:8px;max-width:100%;box-sizing:border-box}button{background:#12635b;color:white;border:0;border-radius:8px;cursor:pointer}textarea{width:100%}.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}.history{max-height:440px;overflow:auto;white-space:pre-wrap}.candidate{border-left:3px solid #12635b;padding-left:12px;margin-bottom:16px;white-space:pre-wrap}.small{font-size:14px;color:#526660}pre{white-space:pre-wrap}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style>
<main><h1>匿名盲评</h1><p>读取真实实验输出目录 grading 中的 JSON 文件。此页不会联网，方案来源不会显示。先阅读完整历史，再分别评价 A、B；五项可用条件必须全部成立。没有打分不会被当作合格。</p>
<section><label>选择 grading 文件（可多选）<input id="files" type="file" accept="application/json,.json" multiple></label><label>评分人代号<input id="judge" autocomplete="off"></label><label>当前样本<select id="cases"></select></label><span id="progress"></span><p id="status" role="status"></p></section>
<section><h2>同一输入</h2><p id="request"></p><p id="rubric"></p><label>搜索全部历史<input id="search"></label><div id="history" class="history"></div></section>
<div id="pair" class="pair"></div><section><button id="save">保存本样本评分</button> <button id="export">导出已保存CSV</button> <button id="backup">导出评分备份JSON</button><label>恢复评分备份<input id="restore" type="file" accept=".json"></label><p class="small">页面刷新不会自动保留评分，请及时导出备份。评分备份含输入哈希及分数，不含模型密钥。CSV交给 score_quality.py 校验；本页不宣布95/100通过。</p></section></main>
<script>
const $=id=>document.getElementById(id), samples=new Map(), scores=new Map();
const criteria={direct_use:'至少一条候选可直接使用或仅需轻微修改（明确拒绝时正确不回复也可）',no_fabrication:'没有编造经历、承诺或混淆身份',key_history:'充分利用关键历史，没有遗忘重要早期事实',host_style:'语言形式贴近主播真实样本，分段与长度自然',respects_boundaries:'尊重明确拒绝和交流边界'};
const metrics={natural_1_5:'自然度',style_1_5:'主播口吻',history_1_5:'历史贴合',emotion_1_5:'情绪沟通',usability_1_5:'可用性'};
const msg=s=>{$('status').textContent=s};
function el(tag,text){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;return e}
function current(){return samples.get($('cases').value)}
function showHistory(){const c=current();if(!c)return;const q=$('search').value.trim().toLowerCase();$('history').textContent=c.conversation.messages.filter(m=>!q||m.body.toLowerCase().includes(q)||m.id.includes(q)).sort((a,b)=>a.order-b.order).map(m=>`${m.order} [${m.speaker}] ${m.time||'时间未知'} ${m.id}\n${m.body}`).join('\n\n')}
function render(){const c=current();if(!c)return;$('request').textContent=c.query;$('rubric').textContent='预先定义的核对重点：'+c.rubric.expected;$('pair').replaceChildren();showHistory();
 for(const variant of ['A','B']){const box=el('article');box.append(el('h2','方案 '+variant));const value=c[variant];if(value.no_reply)box.append(el('p','建议不回复：'+value.no_reply_reason));for(const [i,entry] of value.candidates.entries()){const part=el('div',`${i+1} · ${entry.style}\n`+entry.segments.map((text,j)=>`${j+1}｜${text}`).join('\n\n'));part.className='candidate';box.append(part)}
 const saved=scores.get(c.id+'|'+variant);for(const [key,label] of Object.entries({...criteria,...metrics})){const l=el('label',label);const select=el('select');select.id=variant+'-'+key;select.append(new Option('请选择',''));const options=key in criteria?[['符合','1'],['不符合','0']]:[1,2,3,4,5].map(n=>[String(n),String(n)]);for(const [text,v]of options)select.append(new Option(text,v));select.value=saved?.[key]??'';l.append(select);box.append(l)}const notes=el('textarea');notes.id=variant+'-notes';notes.placeholder='理由、原文证据与问题';notes.value=saved?.notes??'';box.append(notes);$('pair').append(box)}
 $('progress').textContent=`${samples.size}组已载入；${scores.size}条方案评分已保存`;
}
const hashPattern=/^[a-f0-9]{64}$/, idPattern=/^[A-Za-z0-9_-]+$/;
function validateSample(c){
 if(!idPattern.test(c.id||'')||!hashPattern.test(c.input_sha256||'')||typeof c.query!=='string'||typeof c.rubric?.expected!=='string'||!Array.isArray(c.conversation?.messages))throw Error('请选择grading中的完整盲评文件');
 if(c.conversation.messages.some(m=>typeof m.id!=='string'||typeof m.body!=='string'||typeof m.speaker!=='string'||!Number.isFinite(m.order)))throw Error('历史记录格式不符');
 for(const variant of ['A','B']){const v=c[variant];if(typeof v?.no_reply!=='boolean'||typeof v.no_reply_reason!=='string'||!Array.isArray(v.candidates)||v.candidates.some(r=>typeof r.style!=='string'||!Array.isArray(r.segments)||r.segments.some(s=>typeof s!=='string')))throw Error('候选格式不符')}
}
$('files').onchange=async e=>{try{
 const pending=new Map();
 for(const f of e.target.files){
  const raw=await f.arrayBuffer(), gradingHash=[...new Uint8Array(await crypto.subtle.digest('SHA-256',raw))].map(n=>n.toString(16).padStart(2,'0')).join('');
  const c=JSON.parse(new TextDecoder().decode(raw));validateSample(c);c.grading_sha256=gradingHash;
  const old=samples.get(c.id), saved=scores.get(c.id+'|A')||scores.get(c.id+'|B'), incoming=pending.get(c.id);
  if([old,saved,incoming].some(v=>v&&v.grading_sha256!==gradingHash))throw Error('同名样本输入不同，请另开评分页面，避免混合实验');
  pending.set(c.id,c);
 }
 for(const c of pending.values())samples.set(c.id,c);
 $('cases').replaceChildren(...[...samples.keys()].sort().map(id=>new Option(id,id)));render();msg('已载入；没有预填任何合格分数。');
}catch(err){msg(err.message)}};
$('cases').onchange=render;$('search').oninput=showHistory;
$('save').onclick=()=>{const c=current(), judge=$('judge').value.trim();if(!c||!judge){msg('请先载入样本并填写评分人。');return}const pending=[];for(const variant of ['A','B']){const row={case_id:c.id,variant,judge,input_sha256:c.input_sha256,grading_sha256:c.grading_sha256};for(const key of Object.keys({...criteria,...metrics})){const value=$(variant+'-'+key).value;if(value===''){msg('A、B每一项都须人工评分；空白不能代表通过。');return}row[key]=value}row.notes=$(variant+'-notes').value;pending.push(row)}for(const row of pending)scores.set(row.case_id+'|'+row.variant,row);render();msg('已保存本组A/B评分，请及时导出。')};
function download(name,type,text){const u=URL.createObjectURL(new Blob(['\uFEFF'+text],{type})),a=el('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
$('export').onclick=()=>{const fields=['case_id','variant','judge','input_sha256','grading_sha256',...Object.keys(criteria),...Object.keys(metrics),'notes'];const quote=s=>'"'+String(s??'').replaceAll('"','""')+'"';download('human-scores.csv','text/csv;charset=utf-8',[fields,...[...scores.values()].map(r=>fields.map(f=>r[f]))].map(r=>r.map(quote).join(',')).join('\r\n'))};
$('backup').onclick=()=>download('scores-backup.json','application/json',JSON.stringify([...scores.values()],null,2));
$('restore').onchange=async e=>{try{
 if(!e.target.files.length)return;
 const rows=JSON.parse((await e.target.files[0].text()).replace(/^\uFEFF/,'')), pending=new Map(), hashes=new Map();
 if(!Array.isArray(rows))throw Error('评分备份须为数组');
 for(const r of rows){
  if(!idPattern.test(r.case_id||'')||!['A','B'].includes(r.variant)||typeof r.judge!=='string'||!r.judge.trim()||!hashPattern.test(r.input_sha256||'')||!hashPattern.test(r.grading_sha256||'')||Object.keys(criteria).some(k=>!['0','1'].includes(r[k]))||Object.keys(metrics).some(k=>!['1','2','3','4','5'].includes(r[k]))||typeof r.notes!=='string')throw Error('评分备份格式不符；不得恢复空白或非法分数');
  const key=r.case_id+'|'+r.variant, loaded=samples.get(r.case_id), previous=scores.get(r.case_id+'|A')||scores.get(r.case_id+'|B'), incoming=hashes.get(r.case_id);
  if(pending.has(key))throw Error('评分备份含重复方案');
  if([loaded,previous,incoming].some(v=>v&&(v.grading_sha256!==r.grading_sha256||v.input_sha256!==r.input_sha256)))throw Error('备份与当前输入哈希不一致');
  pending.set(key,r);hashes.set(r.case_id,r);
 }
 for(const [key,r]of pending)scores.set(key,r);render();msg('已恢复评分。');
}catch(err){msg(err.message)}};
</script></html>
